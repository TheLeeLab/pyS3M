name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialise runs on the same branch/PR rather than letting them race -- two
# main-push runs close together can otherwise both reach the coverage-badge
# step around the same time and non-fast-forward-reject each other's push to
# gh-pages. Cancel stale runs on a PR (new commit supersedes the old one,
# nothing there pushes anywhere), but queue (never cancel) on main so every
# push still gets its own full run and its own badge update.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pyS3M (editable, with dev extras)
        run: pip install -e .[dev]

      - name: Run tests with coverage
        run: |
          pytest unit_tests/ \
            --cov=src --cov-report=term-missing --cov-report=json

      - name: Update coverage badge
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: we-cli/coverage-badge-action@main
